# Body pose / what the subject is doing. One BREAK segment.
# Value can be a plain string, or {pos: "...", neg: "..."} to also feed the negative.
entries:
  none: ""
  standing: standing, full body, relaxed posture
  standing contrapposto: standing, contrapposto, weight on one leg, hand on hip
  kneeling: kneeling, sitting on heels, hands on thighs
  all fours: all fours, on hands and knees, arched back
  all fours presenting: >
    REDACTED
  lying on back: lying, on back, knees up, looking at viewer
  lying on stomach: lying, on stomach, legs kicked up, chin on hands
  bent over: bent over, hands on knees, ass toward viewer
  arms bound overhead:
    pos: REDACTED
    neg: ""
  hogtied:
    pos: REDACTED
    neg: ""
  crawling: crawling, on hands and knees, low angle, looking up
  sitting against wall: sitting, back against wall, knees drawn up, tired
