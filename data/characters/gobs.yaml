# Gobs - the orange-haired goblin girl.
# Skin colour is weighted hard because muted-palette Illustrious checkpoints
# desaturate green toward grey; drop the weight if it reads neon.
name: Gobs
weight: 1.0
base: >
  1girl, goblin, goblin girl, (green skin:1.3), green body, colored skin,
  pointy ears, long ears, broad ears, petite, skinny, thin waist, flat chest, small breasts,
  orange hair, wolf cut, messy hair, short hair, yellow eyes,
  sharp teeth, fang, snaggletooth, pig nose, short nubby tail

# Outfits + expressions are shared pools now (data/outfits.yaml, data/expressions.yaml).
