# Shared clothing-colour pool. Chosen per character for the base / contrast /
# detail slots on each card; a free-text override on the card beats this list.
# Character identity colours (hair / eyes / skin) stay in the character's `base`,
# NOT here.
#
# key: value  — value is the tag string that lands in the prompt. Kept as a map
# (not a bare list) so richer tags are possible later, e.g.
#   dusty rose: dusty rose, muted
