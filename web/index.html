<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptForge Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="inputs">
    <div class="scroll">
      <h1>PromptForge <span class="muted" style="font-size:11px">
        <span class="dot down" id="comfyDot"></span> <span id="comfyMsg">…</span></span></h1>

      <h2>Characters <span class="muted" id="charHint"></span></h2>
      <div id="charCards"></div>
      <button class="small" id="addChar">+ Add character</button>

      <h2>Theme</h2>
      <select id="theme"></select>

      <h2>Setting</h2>
      <select id="setting"></select>
      <input type="text" id="settingText" placeholder="…or extra setting tags">

      <h2>Style</h2>
      <select id="style"></select>
      <input type="text" id="styleText" placeholder="…or extra style tags">

      <div id="editorSection" style="display:none">
        <h2>Skeleton <span class="muted" id="skHint"></span></h2>
        <div id="editorWrap"><canvas id="poseCanvas" width="384" height="384"></canvas></div>
        <div class="orientLbl">
          <span id="yawLbl">front</span> · <span id="pitchLbl">eye level</span>
          <span class="muted" style="font-size:10px">drag body to orbit</span>
          <button class="small" id="orientReset" title="reset camera to front">reset view</button>
        </div>
        <div class="row" style="margin-top:6px">
          <select id="poseLib" style="flex:2"></select>
          <button class="small" id="poseLoad">Load</button>
          <button class="small" id="poseReset" title="discard tweaks, reload the base pose">Reset pose</button>
          <button class="small" id="poseSave">Save…</button>
        </div>
        <label>Pose keywords (prompt)</label>
        <input type="text" id="poseKeywords" placeholder="e.g. arms crossed, weight on one leg — optional">
        <div id="editorTools"></div>
      </div>

      <h2>Model</h2>
      <select id="model"></select>

      <details>
        <summary>Advanced</summary>
        <div class="grid2" style="margin-top:6px">
          <div><label>CFG</label><input type="number" id="cfg" step="0.5" value="6"></div>
          <div><label>Steps</label><input type="number" id="steps" value="30"></div>
          <div><label>Sampler</label><input type="text" id="sampler" value="dpmpp_2m_sde"></div>
          <div><label>Scheduler</label><input type="text" id="scheduler" value="karras"></div>
          <div><label>Width</label><input type="number" id="width" step="16" value="1152"></div>
          <div><label>Height</label><input type="number" id="height" step="16" value="896"></div>
          <div><label>Seed (-1 random)</label><input type="number" id="seed" value="-1"></div>
          <div><label>Batch</label><input type="number" id="batch" value="1"></div>
          <div><label>CN strength</label><input type="number" id="cn_strength" step="0.05" value="0.9"></div>
          <div><label>CN end %</label><input type="number" id="cn_end" step="0.05" value="0.8"></div>
        </div>
        <label>Region layout (2 characters)</label>
        <select id="layout">
          <option>side by side - A left</option>
          <option>side by side - A right</option>
          <option>A lower / B upper</option>
          <option>A upper / B lower</option>
          <option>A center / B around</option>
          <option>thirds - A left</option>
        </select>
      </details>

      <h2>Negative</h2>
      <textarea id="negative" placeholder="extra negative tags (merged with defaults + per-character)"></textarea>

      <details id="previewBox">
        <summary>Prompt preview</summary>
        <div id="preview" style="margin-top:6px">—</div>
      </details>
    </div>
    <div class="foot">
      <button class="gen" id="generate">Generate</button>
      <button class="small" id="reroll" title="new random seed">🎲</button>
    </div>
  </div>

  <div id="gallery"></div>

  <div id="lightbox"><img id="lbImg"><div class="info" id="lbInfo"></div></div>
  <div id="toast"></div>

<script src="/editor.js"></script>
<script src="/app.js"></script>
</body>
</html>
